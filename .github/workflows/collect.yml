name: 베스트셀러 수집

on:
  schedule:
    # 서점 순위는 오전 9시쯤 바뀌므로 9시 정각에 수집한다.
    # 깃허브 예약 실행은 보통 30~40분 늦게 시작해서 미리 깨워 두고 9시까지 기다린다. (시간은 UTC 기준)
    - cron: '20 23 * * *'   # 한국 시각 08:20에 깨움 → 09:00까지 대기 후 수집
    - cron: '10 0 * * *'    # 한국 시각 09:10 예비 — 이미 수집했으면 아무것도 안 하고 끝남
  workflow_dispatch:
    inputs:
      force:
        description: '오늘 것을 처음부터 다시 수집 (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 패키지 설치
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: 오전 9시까지 기다리기
        if: github.event_name == 'schedule'
        run: |
          now=$(date +%s)
          target=$(TZ=Asia/Seoul date -d "$(TZ=Asia/Seoul date +%Y-%m-%d) 09:00:00" +%s)
          if [ "$now" -lt "$target" ]; then
            echo "한국 시각 $(TZ=Asia/Seoul date +%H:%M) — 09:00까지 $(( (target-now)/60 ))분 기다립니다"
            sleep $(( target - now ))
          fi
          echo "수집 시작: $(TZ=Asia/Seoul date '+%H:%M:%S') KST"

      - name: 수집
        run: |
          if [ "${{ github.event.inputs.force }}" = "true" ]; then
            python scraper.py --force
          else
            python scraper.py
          fi

      - name: 결과 저장(커밋)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "바뀐 것 없음"; exit 0
          fi
          git commit -m "순위 수집: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::error::저장(push) 실패"; exit 1
